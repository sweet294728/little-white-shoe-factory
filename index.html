<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>小白鞋工廠</title><link rel="stylesheet" href="scene.css"></head><body>
<main class="scene" aria-label="小白鞋工廠遊戲"><header><h1>小白鞋工廠</h1><div class="topright"><div class="progress"><b id="count">0 / 10</b><span id="dots"></span></div><button id="reset" class="reset" type="button">↻ 重新開始</button></div></header>
<div class="board" id="board" tabindex="0" role="button" aria-label="鞋子組裝區，選擇零件後按 Enter 可以放入"><div class="shoe-stage" id="shoe"><img class="silhouette-img" src="assets/approved-pieces/silhouette.png" alt="鞋子剪影"><div id="placed"></div></div></div>
<section class="parts" aria-label="零件區，可左右滑動"><button class="tray-arrow" id="tray-prev" type="button" aria-label="向左查看零件">‹</button><div class="grid" id="grid"></div><button class="tray-arrow" id="tray-next" type="button" aria-label="向右查看零件">›</button></section><section id="valve-area" class="valve-area" aria-label="最後工序：安裝內側氣閥" hidden><span class="valve-prompt">最後工序 · 安裝內側氣閥</span><button class="part valve-part" data-id="valve" type="button" aria-label="氣閥，拖到鞋底內側後跟"><img src="assets/valve.png" alt=""></button></section><span class="sr-only" id="message" aria-live="polite">從喜歡的零件開始吧。</span><span class="sr-only" id="boardtip">拖曳零件到鞋子上</span></main>
<div class="toast" id="toast" role="status"></div><div class="modal" id="modal" hidden><div class="dialog"><div class="sparkle">✦ ✧ ✦</div><h2>完成啦！</h2><p>四寶和你一起完成了小白鞋。<br>每一步，都有空氣在幫你工作。</p><button id="coupon" class="coupon" type="button" aria-describedby="coupon-note">🎟 點我領取優惠券</button><p id="coupon-note" class="coupon-note" aria-live="polite">優惠券連結即將開放</p><button id="again" type="button">再玩一次</button></div></div><script src="parts-data.js"></script><script src="game.js"></script></body></html>

<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>小白鞋工廠</title><link rel="stylesheet" href="scene.css"></head><body>
<main class="scene" aria-label="小白鞋工廠遊戲"><header><h1>小白鞋工廠</h1><div class="topright"><button id="help" class="help" type="button" aria-label="查看遊戲說明" title="遊戲說明">?</button><div class="progress"><b id="count">0 / 10</b><span id="dots"></span></div><button id="reset" class="reset" type="button">↻ 重新開始</button></div></header>
<div class="board" id="board" tabindex="0" role="button" aria-label="鞋子組裝區，選擇零件後按 Enter 可以放入"><div class="shoe-stage" id="shoe"><img class="silhouette-img" src="assets/approved-pieces/silhouette.png" alt="鞋子剪影"><div id="placed"></div></div><div id="worker-action" class="worker-action" aria-hidden="true" hidden><span class="worker worker-d"></span><span class="worker worker-k"></span><span class="worker worker-e"></span><span class="worker worker-c"></span></div></div>
<section id="part-info" class="part-info" aria-label="DK 空氣鞋零件小教室" aria-live="polite"><strong id="part-info-name">一起認識空氣鞋</strong><div class="info-section"><span class="info-label" id="part-info-label">怎麼玩</span><span id="part-info-text">選一個零件，看看它在鞋子裡的作用。</span></div><div class="info-fact" id="part-info-fact" hidden><span class="info-label" id="part-info-fact-label"></span><span id="part-info-fact-text"></span></div></section><section class="parts" aria-label="零件區，可左右滑動"><button class="tray-arrow" id="tray-prev" type="button" aria-label="向左查看零件">‹</button><div class="grid" id="grid"></div><button class="tray-arrow" id="tray-next" type="button" aria-label="向右查看零件">›</button></section><section id="valve-area" class="valve-area" aria-label="最後工序：安裝內側氣閥" hidden><span class="valve-prompt">最後工序 · 安裝內側氣閥</span><button class="part valve-part" data-id="valve" type="button" aria-label="氣閥，拖到鞋底內側後跟"><img src="assets/valve.png" alt=""></button></section><span class="sr-only" id="message" aria-live="polite">從喜歡的零件開始吧。</span><span class="sr-only" id="boardtip">拖曳零件到鞋子上</span></main>
<div class="intro-modal" id="intro" role="dialog" aria-modal="true" aria-labelledby="intro-title"><div class="intro-card"><div class="intro-kicker">呼吸小氣球製鞋工廠</div><h2 id="intro-title">一起製作小白鞋！</h2><p>和四寶一起組裝小白鞋，認識 DK 空氣鞋的呼吸結構！</p><ol><li><b>挑選零件</b><span>選擇零件，碰觸或滑鼠移到零件上可看名稱與說明。</span></li><li><b>拖曳組裝</b><span>把零件拖到鞋子剪影對應的位置；也可以先點零件，再點鞋子放入。</span></li><li><b>安裝氣閥</b><span>鞋身完成後，翻到內側，把氣閥裝在後跟標記處。</span></li></ol><button id="start-game" type="button">開始製作</button></div></div><div class="toast" id="toast" role="status"></div><div class="modal" id="modal" hidden><div class="dialog"><div class="sparkle">✦ ✧ ✦</div><h2>完成啦！</h2><p>四寶和你一起完成了小白鞋。<br>每一步，都有空氣在幫你工作。</p><button id="coupon" class="coupon" type="button" aria-describedby="coupon-note">🎟 點我領取優惠券</button><p id="coupon-note" class="coupon-note" aria-live="polite">優惠券連結即將開放</p><button id="again" type="button">再玩一次</button></div></div><script src="parts-data.js"></script><script src="game.js"></script></body></html>
